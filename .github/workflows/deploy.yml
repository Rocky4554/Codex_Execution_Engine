name: Deploy Executor Agent to EC2

# ── When does this run? ────────────────────────────────────────────────────────
# Only on a push to main, and only when something that actually affects the
# running agent changed. Editing a README should not restart production.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'docker-compose.ec2.yml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}   # adds a manual "Run workflow" button (used for rollbacks)

# ── Never let two deploys touch the box at once ───────────────────────────────
# cancel-in-progress: false is deliberate. Cancelling a deploy halfway could
# leave the container stopped. Queue instead of cancel.
concurrency:
  group: ec2-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_BASENAME: codex-executor-agent

jobs:
  # ── 1. CI gate: does the code even work? ────────────────────────────────────
  test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven          # caches ~/.m2 between runs — big speedup

      - name: Run tests
        run: mvn -B --no-transfer-progress test

  # ── 2. Build the image ONCE, on GitHub's runner (not on the t2.micro) ───────
  build-and-push:
    name: Build image & push to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write        # required for GITHUB_TOKEN to push to ghcr.io
    outputs:
      image: ${{ steps.vars.outputs.image }}
      tag:   ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name and immutable tag
        id: vars
        run: |
          # Registry paths MUST be lowercase; the GitHub owner may not be.
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=${REGISTRY}/${owner}/${IMAGE_BASENAME}" >> "$GITHUB_OUTPUT"
          # Tag with the commit SHA, never just :latest — see CICD.md ("immutable tags").
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, no secret to manage

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}
            ${{ steps.vars.outputs.image }}:latest
          cache-from: type=gha          # reuse Docker layers across CI runs
          cache-to: type=gha,mode=max

  # ── 3. Deploy: EC2 only pulls a finished image and restarts ─────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Pull new image, restart, health-check, roll back on failure
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stops: true
          envs: IMAGE,TAG
          script: |
            set -euo pipefail
            cd ~/codex-execution

            # Sync the compose file / scripts to match the image we're deploying.
            # .env is untracked, so reset --hard never touches it.
            git fetch origin main
            git reset --hard origin/main
            chmod +x docker/executors/build-all.sh codex-cleanup.sh codex-cleanup-light.sh 2>/dev/null || true

            # What is running right now? Needed for rollback.
            PREV_IMAGE="$(docker inspect -f '{{.Config.Image}}' codex-executor-agent 2>/dev/null || true)"
            echo "Currently running: ${PREV_IMAGE:-<nothing>}"
            echo "Deploying:         ${IMAGE}:${TAG}"

            deploy_tag() {
              IMAGE_TAG="$1" docker compose -f docker-compose.ec2.yml --env-file .env pull
              IMAGE_TAG="$1" docker compose -f docker-compose.ec2.yml --env-file .env up -d
            }

            deploy_tag "${TAG}"

            # Health gate: give the JVM time to boot, then prove it actually serves.
            if curl -fsS --retry 20 --retry-delay 3 --retry-all-errors \
                 http://localhost:8081/v1/healthz > /dev/null; then
              echo "✅ Healthy on ${TAG}"
              docker image prune -f    # reclaim disk on the small EBS volume
            else
              echo "❌ Health check FAILED on ${TAG} — rolling back"
              if [ -n "${PREV_IMAGE}" ]; then
                deploy_tag "${PREV_IMAGE##*:}"   # strip everything up to the last ':'
                echo "Rolled back to ${PREV_IMAGE}"
              else
                echo "No previous image to roll back to."
              fi
              exit 1     # fail the workflow so you actually get notified
            fi
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          TAG:   ${{ needs.build-and-push.outputs.tag }}
